services:
  llama-turboquant:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_SOURCE=${MODEL_SOURCE:-hf}
      - HF_REPO=${HF_REPO:-ggml-org/gemma-3-1b-it-GGUF:Q4_K_M}
      - MODEL_FILE=${MODEL_FILE:-/models/model.gguf}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8080}
      - CTX_SIZE=${CTX_SIZE:-4096}
      - THREADS=${THREADS:-6}
      - THREADS_BATCH=${THREADS_BATCH:-8}
      - THREADS_HTTP=${THREADS_HTTP:-2}
      - BATCH_SIZE=${BATCH_SIZE:-256}
      - UBATCH_SIZE=${UBATCH_SIZE:-128}
      - PARALLEL=${PARALLEL:-1}
      - CACHE_TYPE_K=${CACHE_TYPE_K:-tq3_0}
      - CACHE_TYPE_V=${CACHE_TYPE_V:-tq3_0}
      - MLOCK=${MLOCK:-0}
      - EXTRA_ARGS=${EXTRA_ARGS:---jinja}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - llama-cache:/root/.cache/llama.cpp
      - models:/models
    expose:
      - "8080"

volumes:
  hf-cache:
  llama-cache:
  models:
